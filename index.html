<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAPOLY Cab Ride</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: "Segoe UI", Arial, sans-serif; }
  canvas { display: block; }
  #hud { position: fixed; left: 16px; top: 14px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.6); pointer-events: none;
         background: rgba(0,0,0,.35); padding: 8px 12px; border-radius: 8px; max-width: calc(100vw - 56px); }
  #hud .t { font-weight: 700; font-size: 18px; }
  #hud .l { font-size: 14px; opacity: .95; margin-top: 4px; }

           color: #fff; text-align: center; pointer-events: none; opacity: 0; padding: 0 16px; text-shadow: 0 3px 8px rgba(0,0,0,.7); }
  #title h1 { margin: 0; font-size: clamp(24px, 5vw, 54px); }
  #title p { margin: 10px 0 0; font-size: clamp(14px, 2.2vw, 22px); color: #d6f5d6; }
  #ctrl { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 8px; }
  #ctrl button { background: #0b6b2e; color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; font-weight: 600; cursor: pointer; font-size: 14px; }
  #ctrl button:hover { background: #0e8a3b; }
  #bar { position: fixed; left: 0; bottom: 0; height: 4px; background: #2ecc71; width: 0; }
</style>
</head>
<body>
<div id="hud"><div class="t">MAPOLY · Ojere Campus, Abeokuta</div><div class="l" id="loc"></div></div>
<div id="fade"></div>
<div id="title"><h1 id="titleH">Moshood Abiola Polytechnic</h1><p id="titleP">Ojere, Abeokuta, Ogun State</p></div>
<div id="ctrl"><button id="sound">Sound: Off</button><button id="pause">Pause</button><button id="replay">Replay</button></div>
<div id="bar"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- Editable content ----------
const BOARD_LINES = [
  'COM 211: Introduction to Web Development',
  'Topic: 2D Animation with Three.js',
  '• HTML  - page structure',
  '• CSS   - styling & layout',
  '• JS    - logic & animation',
  'const scene = new THREE.Scene();',
  'renderer.render(scene, camera);'
];
const BOARD_DATE = '25/10/2026';

// Ogun State cab livery: blue body, white side stripe
const CAB_BLUE = '#1f4fa8', CAB_WHITE = '#ffffff';
const MAPOLY_GREEN = '#0b6b2e', MAPOLY_GOLD = '#f2c418';

// ---------- Renderer / camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#8fd3ff');
const cam = new THREE.OrthographicCamera(-640, 640, 360, -360, 0.1, 3000);
cam.position.z = 500;
scene.add(cam);

// ---------- Drawing helpers ----------
function mat(c, extra) {
  return new THREE.MeshBasicMaterial(Object.assign({ color: c, side: THREE.DoubleSide }, extra || {}));
}
function grp(p, x = 0, y = 0, z = 0) { const g = new THREE.Group(); g.position.set(x, y, z); p.add(g); return g; }
function rect(p, w, h, c, x, y, z = 0, extra) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat(c, extra)); m.position.set(x, y, z); p.add(m); return m;
}
function circ(p, r, c, x, y, z = 0, extra) {
  const m = new THREE.Mesh(new THREE.CircleGeometry(r, 40), mat(c, extra)); m.position.set(x, y, z); p.add(m); return m;
}
function ell(p, rx, ry, c, x, y, z = 0, rot = 0) {
  const m = circ(p, 1, c, x, y, z); m.scale.set(rx, ry, 1); m.rotation.z = rot; return m;
}
function poly(p, pts, c, z = 0, extra) {
  const s = new THREE.Shape(); s.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) s.lineTo(pts[i][0], pts[i][1]);
  const m = new THREE.Mesh(new THREE.ShapeGeometry(s), mat(c, extra)); m.position.z = z; p.add(m); return m;
}
function makeText(lines, o = {}) {
  lines = [].concat(lines);
  const px = o.px || 48, font = `${o.weight || 'bold'} ${px}px ${o.family || 'Arial, sans-serif'}`;
  const c = document.createElement('canvas'), x = c.getContext('2d');
  x.font = font;
  const pad = o.pad != null ? o.pad : px * 0.4, lh = px * 1.25;
  const w = Math.ceil(Math.max(...lines.map(l => x.measureText(l).width)) + pad * 2);
  const h = Math.ceil(lines.length * lh - (lh - px) + pad * 2);
  c.width = w; c.height = h;
  if (o.bg) { x.fillStyle = o.bg; x.fillRect(0, 0, w, h); }
  if (o.border) { x.strokeStyle = o.border; x.lineWidth = px * 0.14; x.strokeRect(x.lineWidth / 2, x.lineWidth / 2, w - x.lineWidth, h - x.lineWidth); }
  x.font = font; x.fillStyle = o.color || '#fff'; x.textBaseline = 'top'; x.textAlign = 'center';
  lines.forEach((l, i) => x.fillText(l, w / 2, pad + i * lh));
  const tex = new THREE.CanvasTexture(c); tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
  return { tex, w, h };
}
// size = plane height (or width when byWidth)
function label(p, lines, o, x, y, z, size, byWidth) {
  const t = makeText(lines, o);
  const h = byWidth ? size * t.h / t.w : size, w = byWidth ? size : size * t.w / t.h;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: t.tex, transparent: true, side: THREE.DoubleSide }));
  m.position.set(x, y, z); p.add(m); LABELS.push(m); return m;
}
const LABELS = [];   // text planes, un-mirrored when the world is flipped for the left-side view
const clamp01 = v => Math.max(0, Math.min(1, v));
const prog = (t, a, b) => clamp01((t - a) / (b - a));
const ease = u => u * u * (3 - 2 * u);
const lerp = (a, b, u) => a + (b - a) * u;

// ---------- Layout constants ----------
const BASE = -170;       // building base / sidewalk top
const SIDE_Y = -182;     // feet on sidewalk
const ROAD_Y = -250;     // cab wheel bottom
const FLOOR = -220;      // classroom floor

// ---------- Characters ----------
function person(p, o) {
  const g = grp(p);
  const body = grp(g);
  const legL = grp(body, -4, 55, -0.5), legR = grp(body, 5, 55, 0.5);
  [legL, legR].forEach(L => { rect(L, 13, 56, o.bottom, 0, -27, 0); rect(L, 22, 8, o.shoe || '#222', 4, -53, 0.05); });
  if (o.female) poly(body, [[-19, 18], [21, 18], [17, 62], [-15, 62]], o.skirt || o.bottom, 0.9);
  const armB = grp(body, 0, 100, -1);
  rect(armB, 10, 44, o.sleeve || o.top, 0, -20, 0); circ(armB, 6, o.skin, 0, -43, 0.01);
  rect(body, 32, 50, o.top, 0, 80, 0);
  if (o.tie) poly(body, [[2, 104], [6, 104], [7, 78], [4, 72], [1, 78]], o.tie, 0.05);
  if (o.agbada) { poly(body, [[-24, 56], [26, 56], [22, 104], [-20, 104]], o.agbada, 0.04); }
  rect(body, 10, 8, o.skin, 2, 106, 0.02);
  const head = grp(body, 2, 123, 0.6);
  circ(head, 15, o.skin, 0, 0, 0);
  if (o.female) { ell(head, 17, 10, o.hair, -2, 8, 0.02); rect(head, 8, 26, o.hair, -14, -8, -0.01); }
  else if (o.cap) { ell(head, 16, 9, o.cap, 0, 10, 0.02); rect(head, 12, 4, o.cap, 13, 6, 0.03); }
  else ell(head, 16, 8, o.hair, -1, 10, 0.02);
  circ(head, 2.2, '#111', 9, 2, 0.05);
  rect(head, 6, 1.6, '#5a2a1a', 9, -7, 0.05);
  if (o.glasses) { rect(head, 9, 6, '#333', 9, 2, 0.04); rect(head, 7, 4, '#9cd3ff', 9, 2, 0.045); }
  if (o.bag) { rect(body, 14, 36, o.bag, -21, 82, 0.7); rect(body, 4, 30, '#222', -12, 86, 0.75); }
  if (o.book) { /* folder held in front hand */ }
  const armF = grp(body, 0, 100, 1.5);
  rect(armF, 10, 44, o.sleeve || o.top, 0, -20, 0); circ(armF, 6, o.skin, 0, -43, 0.01);
  if (o.marker) rect(armF, 4, 14, '#1b3fbf', 4, -50, 0.02);
  g.userData = { legL, legR, armF, armB, body, mats: [] };
  g.traverse(m => { if (m.material) { m.material.transparent = true; g.userData.mats.push(m.material); } });
  return g;
}
function pose(ch, phase, amp) {
  const u = ch.userData, s = Math.sin(phase) * 0.5 * amp;
  u.legL.rotation.z = s; u.legR.rotation.z = -s;
  u.armF.rotation.z = -s * 0.8; u.armB.rotation.z = s * 0.8;
  u.body.position.y = Math.abs(Math.cos(phase)) * 2 * amp;
}
function sitPose(ch, k) {
  const u = ch.userData;
  u.legL.rotation.z = u.legR.rotation.z = Math.PI / 2 * k;
  u.armF.rotation.z = u.armB.rotation.z = 1.35 * k;
  u.body.position.y = -10 * k;
}
function setAlpha(ch, a) { ch.visible = a > 0.01; ch.userData.mats.forEach(m => m.opacity = a); }

const STUDENT_A = { skin: '#6b4226', top: '#ffffff', sleeve: '#f2f2f2', bottom: '#1b1f2a', hair: '#111', bag: '#2d5d8f', tie: MAPOLY_GREEN };
const STUDENT_B = { skin: '#7a4b2c', top: '#2f6fd1', bottom: '#3a3a3a', skirt: '#24324a', hair: '#1a0f0a', female: true, bag: '#b8443a' };

// ---------- Outdoor world ----------
const world = grp(scene);
const L = {
  clouds: grp(world, 0, 0, -60),
  hills: grp(world, 0, 0, -40),
  mid: grp(world, 0, 0, -20),
  main: grp(world, 0, 0, 0),
  front: grp(world, 0, 0, 60)
};
const FACTOR = { clouds: 0.06, hills: 0.25, mid: 0.6, main: 1, front: 1.25 };

// sky (fixed to camera)
const skyCanvas = document.createElement('canvas'); skyCanvas.width = 4; skyCanvas.height = 256;
{ const x = skyCanvas.getContext('2d'), gr = x.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#4fa8e8'); gr.addColorStop(0.7, '#a8dcff'); gr.addColorStop(1, '#e8f6ff');
  x.fillStyle = gr; x.fillRect(0, 0, 4, 256); }
const sky = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(skyCanvas) }));
sky.position.z = -2000; cam.add(sky);
const sun = grp(cam, 0, 0, -1990);
circ(sun, 70, '#fff6c8', 0, 0, 0, { transparent: true, opacity: 0.5 }); circ(sun, 48, '#ffe066', 0, 0, 0.1);

// clouds
const cloudList = [];
for (let i = 0; i < 14; i++) {
  const c = grp(L.clouds, -900 + i * 260 + Math.random() * 120, 160 + Math.random() * 150, 0);
  const s = 0.6 + Math.random() * 0.7;
  [[0, 0, 50], [45, 8, 40], [-45, 4, 36], [20, 28, 36], [-18, 24, 32]].forEach(([x, y, r]) => circ(c, r * s, '#ffffff', x * s, y * s, 0));
  cloudList.push(c);
}

// distant hills + lawn
{
  const pts = [[-1200, -300]];
  for (let x = -1200; x <= 3600; x += 80) pts.push([x, -40 + Math.sin(x * 0.004) * 45 + Math.sin(x * 0.011) * 18]);
  pts.push([3600, -300]);
  poly(L.hills, pts, '#7fae6b', 0);
  const pts2 = [[-1200, -300]];
  for (let x = -1200; x <= 3600; x += 80) pts2.push([x, -85 + Math.sin(x * 0.006 + 2) * 25]);
  pts2.push([3600, -300]);
  poly(L.hills, pts2, '#6a9f57', 1);
  rect(L.hills, 5000, 400, '#79b35a', 1200, -300, 2);
}

// mid layer: faded campus blocks + tree line
function tree(p, x, y, s, z, dark) {
  const g = grp(p, x, y, z);
  rect(g, 12 * s, 60 * s, '#6b4a2b', 0, 30 * s, 0);
  const greens = dark ? ['#2f6b2a', '#3d7f34', '#2a5f26'] : ['#3c8a3a', '#4fa14a', '#357a33'];
  [[0, 80, 42], [-30, 62, 32], [30, 64, 34], [-14, 98, 30], [18, 96, 30]].forEach(([cx, cy, r], i) => circ(g, r * s, greens[i % 3], cx * s, cy * s, 0.1 + i * 0.01));
  return g;
}
function palm(p, x, y, h, z) {
  const g = grp(p, x, y, z);
  for (let i = 0; i < h / 14; i++) rect(g, 12 - i * 0.15, 15, i % 2 ? '#8a6a45' : '#7a5c3a', Math.sin(i * 0.25) * 4, i * 14 + 7, 0);
  const top = grp(g, Math.sin((h / 14) * 0.25) * 4, h, 0.2);
  for (let k = 0; k < 7; k++) { const a = -0.3 + k * (Math.PI + 0.6) / 6; ell(top, 48, 8, k % 2 ? '#2f8a3a' : '#3fa14a', Math.cos(a) * 36, Math.sin(a) * 14 - 4, k * 0.01, a + (a > Math.PI / 2 ? -0.5 : 0.5) * 0); }
  circ(top, 7, '#5a3d1e', 0, 0, 0.1);
  g.userData.top = top;
  return g;
}
for (let x = -900; x < 5600; x += 230) {
  const h = 70 + (Math.abs(Math.sin(x)) * 90 | 0), w = 120 + (Math.abs(Math.cos(x)) * 120 | 0);
  if (Math.sin(x * 0.7) > -0.2) {
    const bg = grp(L.mid, x, -110, 0);
    rect(bg, w, h, '#d9d5c4', 0, h / 2, 0);
    for (let r = 0; r < Math.floor(h / 40); r++) rect(bg, w - 20, 10, '#b9c6cf', 0, 22 + r * 40, 0.1);
    poly(bg, [[-w / 2 - 10, h], [w / 2 + 10, h], [w / 2 - 20, h + 22], [-w / 2 + 20, h + 22]], '#9aa3a8', 0.2);
  }
  tree(L.mid, x + 110, -112, 0.9 + Math.abs(Math.sin(x * 3)) * 0.5, 1, true);
}

// ---------- Main layer: road, sidewalk ----------
function repTex(draw, w, h, rx) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'));
  const t = new THREE.CanvasTexture(c); t.wrapS = THREE.RepeatWrapping; t.repeat.set(rx, 1); return t;
}
const ROAD_X0 = -1500, ROAD_X1 = 9800, ROAD_W = ROAD_X1 - ROAD_X0, ROAD_CX = (ROAD_X0 + ROAD_X1) / 2;
rect(L.main, ROAD_W, 20, '#c9c2b0', ROAD_CX, BASE - 10, 10);                       // sidewalk
const kerbTex = repTex(x => { x.fillStyle = '#111'; x.fillRect(0, 0, 32, 16); x.fillStyle = '#f4f4f4'; x.fillRect(32, 0, 32, 16); }, 64, 16, ROAD_W / 64);
rect(L.main, ROAD_W, 12, '#fff', ROAD_CX, BASE - 26, 10.5, { map: kerbTex });     // painted kerb
rect(L.main, ROAD_W, 110, '#4a4d52', ROAD_CX, BASE - 87, 10);                      // asphalt
const dashTex = repTex(x => { x.fillStyle = '#f5f5f5'; x.fillRect(0, 0, 60, 8); }, 120, 8, ROAD_W / 120);
rect(L.main, ROAD_W, 5, '#fff', ROAD_CX, BASE - 92, 10.6, { map: dashTex, transparent: true });
rect(L.main, ROAD_W, 200, '#5f9e45', ROAD_CX, BASE - 240, 9.5);                    // verge under road
rect(L.front, ROAD_W * 1.4, 120, '#4f8f3a', ROAD_CX * 1.25, -370, 0);              // foreground grass
for (let x = -1500; x < 12500; x += 70) {
  const g = grp(L.front, x + Math.sin(x) * 20, -322, 1);
  for (let k = -2; k <= 2; k++) poly(g, [[k * 6 - 3, 0], [k * 6 + 3, 0], [k * 9, 18 + Math.abs(Math.cos(x + k)) * 14]], k % 2 ? '#3d7f2f' : '#5aa845', 0);
  if (Math.sin(x * 1.3) > 0.7) { circ(g, 5, '#e84a5f', 4, 22, 0.1); circ(g, 4, '#ffd23f', -8, 18, 0.1); }
}

// signboards on posts
function signBoard(p, x, lines, o = {}) {
  const g = grp(p, x, BASE - 4, 14);
  const w = o.w || 200;
  const plane = label(g, lines, { bg: o.bg || MAPOLY_GREEN, color: o.color || '#fff', border: o.border || '#fff', px: 44 }, 0, 0, 0.2, w, true);
  const h = plane.geometry.parameters.height, top = (o.post || 70) + h;
  plane.position.y = top - h / 2;
  rect(g, 6, top, '#7a7a7a', -w / 2 + 14, top / 2, 0); rect(g, 6, top, '#7a7a7a', w / 2 - 14, top / 2, 0);
  return g;
}
function streetLight(p, x) {
  const g = grp(p, x, BASE - 4, 13);
  rect(g, 6, 200, '#6d7278', 0, 100, 0); rect(g, 50, 5, '#6d7278', 22, 198, 0); rect(g, 22, 8, '#ddd', 44, 194, 0.1);
}
function hedge(p, x, w) { const g = grp(p, x, BASE - 2, 12); for (let i = 0; i < w / 26; i++) circ(g, 16, i % 2 ? '#3f8c35' : '#4c9d40', -w / 2 + i * 26, 10, i * 0.001); }
function flag(p, x, cols) {
  const g = grp(p, x, BASE - 4, 12.5);
  rect(g, 5, 210, '#bbb', 0, 105, 0);
  const f = grp(g, 3, 190, 0.1);
  cols.forEach((c, i) => rect(f, 22, 44, c, 11 + i * 22, 0, 0));
  g.userData.f = f; flags.push(f);
  return g;
}
const flags = [];

// generic campus block
function building(p, cx, o) {
  const fh = o.fh || 72, base = 14, h = o.floors * fh + base;
  const g = grp(p, cx, BASE, o.z || 3);
  rect(g, o.w, h, o.wall, 0, h / 2, 0);
  rect(g, o.w + 10, base, o.trim, 0, base / 2, 0.1);
  for (let f = 1; f <= o.floors; f++) rect(g, o.w + 6, 7, o.trim, 0, base + f * fh - 3, 0.1);
  const gap = o.winGap || 64, cols = Math.floor((o.w - 30) / gap);
  for (let f = 0; f < o.floors; f++) for (let c = 0; c < cols; c++) {
    const wx = -((cols - 1) / 2) * gap + c * gap, wy = base + f * fh + fh / 2 - 2;
    if (f === 0 && Math.abs(wx) < 50) continue;
    rect(g, 38, 42, o.frame || '#5b5b5b', wx, wy, 0.2);
    rect(g, 32, 36, o.glass || '#7fb6d9', wx, wy, 0.3);
    rect(g, 2, 36, o.frame || '#5b5b5b', wx, wy, 0.35);
    if (o.louver) for (let k = -2; k <= 2; k++) rect(g, 32, 2, '#d0d0d0', wx, wy + k * 7, 0.36);
  }
  // entrance with two door leaves
  rect(g, 86, 74, o.trim, 0, base + 37, 0.2);
  rect(g, 76, 66, '#2b2b2b', 0, base + 33, 0.3);
  const dl = grp(g, -38, base, 0.4), dr = grp(g, 38, base, 0.4);
  rect(dl, 38, 66, o.door || '#6d4a2b', 19, 33, 0); rect(dl, 3, 10, '#ccc', 33, 33, 0.01);
  rect(dr, 38, 66, o.door || '#6d4a2b', -19, 33, 0); rect(dr, 3, 10, '#ccc', -33, 33, 0.01);
  g.userData.doors = [dl, dr];
  rect(g, 120, 8, '#bdb6a6', 0, 4, 0.5); // steps
  if (o.roof === 'pitch') poly(g, [[-o.w / 2 - 22, h], [o.w / 2 + 22, h], [o.w / 2 - 50, h + (o.roofH || 46)], [-o.w / 2 + 50, h + (o.roofH || 46)]], o.roofC || '#8b2f2a', 0.2);
  else { rect(g, o.w + 8, 22, o.trim, 0, h + 8, 0.2); }
  if (o.fascia) label(g, o.fascia, { bg: o.signBg || MAPOLY_GREEN, color: '#fff', px: 40 }, 0, base + fh - 3, 0.6, Math.min(o.w - 40, o.fasciaW || 380), true);
  g.userData.h = h;
  return g;
}

const SPOTS = [];
function spot(x, name) { SPOTS.push({ x, name }); }

const FAR = grp(L.main), NEAR = grp(L.main);   // FAR: car's left roadside (buildings); NEAR: right roadside, seen in the left-side view
// 1. Cab park + main gate
spot(0, 'Taxi park at the MAPOLY main gate');
{
  // cab park shelter
  const s = grp(FAR, -330, BASE, 4);
  rect(s, 6, 120, '#777', -110, 60, 0); rect(s, 6, 120, '#777', 110, 60, 0);
  poly(s, [[-130, 118], [130, 118], [120, 136], [-120, 136]], '#2f7d4a', 0.1);
  label(s, 'MAPOLY TAXI PARK', { bg: MAPOLY_GOLD, color: '#173d22', px: 40 }, 0, 108, 0.2, 170, true);
  rect(s, 160, 8, '#8a6a45', 0, 34, 0.2); rect(s, 6, 30, '#8a6a45', -70, 18, 0.1); rect(s, 6, 30, '#8a6a45', 70, 18, 0.1);
  palm(FAR, -620, BASE - 4, 210, 5);
  tree(FAR, -110, BASE - 4, 1.4, 4.5);
}
const GATE_X = 650;
spot(GATE_X, 'Main Gate – Moshood Abiola Polytechnic');
{
  const g = grp(FAR, GATE_X, BASE, 6);
  for (const s of [-1, 1]) {
    rect(g, 48, 250, '#ece6d4', s * 250, 125, 0);
    rect(g, 58, 16, MAPOLY_GREEN, s * 250, 250, 0.1);
    rect(g, 48, 22, MAPOLY_GREEN, s * 250, 11, 0.1);
    for (let k = 0; k < 4; k++) rect(g, 30, 3, '#d4cdb8', s * 250, 50 + k * 50, 0.05);
  }

    p.m.position.x += p.vx * dt; p.m.position.y += p.vy * dt;
    const s = 4 + u * 18; p.m.scale.set(s, s, 1);
    p.m.material.opacity = 0.45 * (1 - u);
  });
}

  set(snd.crowd.gain, outdoor && t > 1 ? 0.025 : 0, 0.4);
  const classNoisy = t > T.room && t < 65.5, classMurmur = t >= 65.5;
  set(snd.classChat.gain, classNoisy ? 0.09 : classMurmur ? 0.018 : 0, 0.5);
  const lectTalk = (t > 60.8 && t < 64.8) || t > 66.5;
  set(snd.lectGain.gain, lectTalk && t < T.total - 1 ? 0.13 : 0, 0.2);
  snd.groups.forEach(g => g.v.forEach(v => speak(v, now, g.talk)));
  DOOR_TIMES.forEach(d => { if (lastSoundT < d && t >= d && t - d < 0.5) snd.thunk(); });
  lastSoundT = t;
}

// ---------- Loop / controls ----------
let t = 0, paused = false, last = performance.now(), rearDt = 0;
function resize() {
  const w = innerWidth, h = innerHeight, a = w / h;
  const vh = Math.max(720, 1280 / a), vw = vh * a;
  cam.left = -vw / 2; cam.right = vw / 2; cam.top = vh / 2; cam.bottom = -vh / 2; cam.updateProjectionMatrix();
  sky.scale.set(vw + 20, vh + 20, 1);
  sun.position.set(vw / 2 - 160, vh / 2 - 110, -1990);
  renderer.setSize(w, h);
}
addEventListener('resize', resize); resize();
const pauseBtn = document.getElementById('pause');
const soundBtn = document.getElementById('sound');
function setSound(on) {
  if (on && !snd.ctx) initAudio();
  if (!snd.ctx) return;
  snd.on = on;
  snd.master.gain.setTargetAtTime(on ? 0.9 : 0, snd.ctx.currentTime, 0.05);
  if (on && !paused) snd.ctx.resume();
  soundBtn.textContent = on ? 'Sound: On' : 'Sound: Off';
}
soundBtn.onclick = e => { e.stopPropagation(); setSound(!snd.on); };
// browsers only allow audio after a user gesture: first click/key anywhere turns sound on
addEventListener('pointerdown', e => { if (!snd.ctx && e.target !== soundBtn) setSound(true); });
pauseBtn.onclick = () => {
  paused = !paused; pauseBtn.textContent = paused ? 'Play' : 'Pause';
  if (snd.ctx) paused ? snd.ctx.suspend() : snd.ctx.resume();
};
document.getElementById('replay').onclick = () => { t = 0; lastSoundT = 0; board.shown = -1; if (paused) pauseBtn.click(); };
addEventListener('keydown', e => {
  if (!snd.ctx) setSound(true);
  if (e.code === 'Space') { e.preventDefault(); pauseBtn.click(); }
});
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  if (!paused) t = Math.min(t + dt, T.total);
  update(t);
  const live = paused ? 0 : dt;
  rearDt = live;
  updateSmoke(live, t < T.room && engineOn(t) ? 9 + cabSpeed(t) * 0.12 : 0, cabSpeed(t));
  if (!paused) updateSound(t);
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// debug: ?t=50 jumps to a time
const qt = parseFloat(new URLSearchParams(location.search).get('t')); if (!isNaN(qt)) t = qt;
</script>
